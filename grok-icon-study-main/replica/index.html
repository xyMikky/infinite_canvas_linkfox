<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星小驰 · Clay Character</title>
<style>
  :root {
    --paper: #ece7dc;
    --ink: #222222;
    --mute: #6d675d;
    --line: #d4cfc3;
    --disk: #ffffff;
    --bg: #1a1a1a;
    --panel: #242424;
    --accent: #e23b4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--paper); }
  body {
    font: 14px/1.5 "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    letter-spacing: 0.01em;
  }
  header {
    padding: 28px 32px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 560;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  header p { margin: 0; color: var(--mute); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: minmax(280px, 420px) 1fr;
    gap: 28px;
    padding: 12px 32px 48px;
    align-items: start;
  }
  .stage {
    position: sticky;
    top: 20px;
    background: var(--panel);
    border: 1px solid #2e2c27;
    border-radius: 20px;
    padding: 28px 24px 20px;
  }
  .disk {
    width: min(100%, 280px);
    aspect-ratio: 1;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--disk);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -18px 40px rgba(40, 30, 10, 0.08), 0 24px 60px rgba(0,0,0,.35);
  }
  .disk svg { width: 68%; height: 68%; overflow: visible; color-scheme: light; --bg: #FFFFFF; --eye: #FFFFFF; --fg: #E23B4C; }
  .stage-disks { display: flex; align-items: flex-end; justify-content: center; gap: 28px; }
  .disk-login {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--disk);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -8px 18px rgba(40, 30, 10, 0.08), 0 12px 28px rgba(0,0,0,.3);
  }
  .disk-login svg { width: 64px; height: 64px; overflow: visible; color-scheme: light; --bg: #FFFFFF; --eye: #FFFFFF; --fg: #E23B4C; }
  .disk-login span {
    display: block;
    margin-top: 8px;
    font-size: 10px;
    color: #8d877b;
    text-align: center;
  }
  .readout {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-variant-numeric: tabular-nums;
    color: #b7b1a4;
    font-size: 12px;
  }
  .readout b { color: var(--paper); font-weight: 560; }
  .modes { display: flex; gap: 8px; margin-top: 16px; }
  button {
    appearance: none;
    border: 1px solid #3a372f;
    background: #2a2823;
    color: var(--paper);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--accent); color: #1a1916; border-color: var(--accent); }
  button:hover { border-color: #6a6458; }
  h2 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    font-weight: 560;
  }
  section + section { margin-top: 22px; }
  .states { display: flex; flex-wrap: wrap; gap: 6px; }
  .states button { font-size: 12px; padding: 5px 10px; }
  .shapes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
  }
  .shape {
    background: #2a2823;
    border: 1px solid #3a372f;
    border-radius: 10px;
    padding: 8px 6px 6px;
    cursor: pointer;
    color: inherit;
    text-align: center;
  }
  .shape[aria-pressed="true"] { border-color: var(--accent); background: #353228; }
  .shape svg { width: 48px; height: 48px; display: block; margin: 0 auto 4px; --fg: #efe8d8; --bg: #2a2823; }
  .shape span { display: block; font-size: 10px; color: #b7b1a4; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #111; cursor: pointer; padding: 0;
  }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note {
    color: #8d877b;
    font-size: 12px;
    max-width: 62ch;
  }
  .note code { color: #d8d0c0; font-size: 11px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .stage { position: static; }
  }
</style>
</head>
<body>
<header>
  <h1>星小驰</h1>
  <p>珊瑚红软海星 · 白竖眼 · 旁侧泡泡 · 纯色扁平</p>
</header>
<main>
  <aside class="stage">
    <div class="stage-disks">
      <div class="disk" id="disk">
        <svg id="bot" role="img" aria-label="星小驰角色"></svg>
      </div>
      <div>
        <div class="disk-login">
          <svg id="bot64" role="img" aria-label="登录尺寸 64 像素"></svg>
        </div>
        <span style="display:block;margin-top:8px;font-size:10px;color:#8d877b;text-align:center">登录 · 64px</span>
      </div>
    </div>
    <div class="modes">
      <button id="mode-onboard" aria-pressed="true">登录轮换</button>
      <button id="mode-hold" aria-pressed="false">锁定状态</button>
    </div>
    <div class="modes">
      <button id="opt-follow" aria-pressed="true">跟随指针</button>
      <button id="opt-emphasis" aria-pressed="false">强调表情</button>
      <button id="act-spin">转一圈</button>
      <button id="act-bounce">跳一下</button>
      <button id="act-burst">粒子</button>
    </div>
    <div class="readout">
      <div>状态 <b id="r-state">空闲</b></div>
      <div>眼睛 <b id="r-eye">0 → 0</b></div>
      <div>旋转 <b id="r-spin">0.00°</b></div>
      <div>挤压 <b id="r-squash">1.000</b></div>
      <div>叠加态 <b id="r-ov">—</b></div>
    </div>
  </aside>
  <div>
    <section>
      <h2>情绪状态 · 共 39 态</h2>
      <div id="states"></div>
    </section>
    <section>
      <h2>身形 · 几何生成器</h2>
      <div class="shapes" id="shapes"></div>
    </section>
    <section>
      <h2>配色 · 调色板</h2>
      <div class="swatches" id="swatches"></div>
    </section>
    <section>
      <h2>星小驰设计口径</h2>
      <p class="note">
        对齐参考造型：<strong>珊瑚红软海星</strong> <code>#E23B4C</code>、白色竖椭圆眼（无瞳孔）、左上/右下三粒同色泡泡。
        与原版墨黑椭圆明显区分；全程纯色扁平，无渐变。
      </p>
    </section>
  </div>
</main>
<script src="geometry-data.js?v=xiaochi5"></script>
<script src="clay-override.js?v=xiaochi5"></script>
<script src="src/math.js?v=xiaochi5"></script>
<script src="src/tables.js?v=xiaochi5"></script>
<script src="src/pose.js?v=xiaochi5"></script>
<script src="src/tricks.js?v=xiaochi5"></script>
<script src="src/fx.js?v=xiaochi5"></script>
<script src="src/eyes.js?v=xiaochi5"></script>
<script src="src/character.js?v=xiaochi5"></script>
<script>
  const readout = {
    state: document.getElementById("r-state"),
    eye: document.getElementById("r-eye"),
    spin: document.getElementById("r-spin"),
    squash: document.getElementById("r-squash"),
    ov: document.getElementById("r-ov"),
  };
  const stateRoot = document.getElementById("states");
  function paintReadout(s) {
    const zh = GROK_TABLES.STATE_LABELS || {};
    readout.state.textContent = zh[s.state] || s.state;
    readout.eye.textContent = `${s.eyeFrom} → ${s.eyeTo}`;
    readout.spin.textContent = `${s.spin.toFixed(2)}°`;
    readout.squash.textContent = s.squash.toFixed(3);
    if (readout.ov) {
      const ov = s.overlay || "—";
      readout.ov.textContent = ov === "—" ? "—" : (zh[ov] || ov);
    }
  }
  function markState(name) {
    stateRoot.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.state === name ? "true" : "false");
    });
  }
  function syncModes(mode) {
    document.getElementById("mode-onboard").setAttribute("aria-pressed", mode === "onboarding");
    document.getElementById("mode-hold").setAttribute("aria-pressed", mode === "hold");
  }

  GROK_META.groups.forEach((group) => {
    const h = document.createElement("h2");
    h.textContent = group.label;
    h.style.marginTop = "8px";
    stateRoot.appendChild(h);
    const row = document.createElement("div");
    row.className = "states";
    group.states.forEach((name) => {
      const b = document.createElement("button");
      b.textContent = (GROK_TABLES.STATE_LABELS && GROK_TABLES.STATE_LABELS[name]) || name;
      b.title = name;
      b.dataset.state = name;
      b.addEventListener("click", () => {
        bots.forEach((el) => {
          el.setMode("hold");
          el.setState(name, { resetEyes: false });
        });
        syncModes("hold");
      });
      row.appendChild(b);
    });
    stateRoot.appendChild(row);
  });

  const shared = { mode: "onboarding", shape: "clay", color: "clay", scheme: "light", loginWrap: true };
  const bot = new GrokCharacter(document.getElementById("bot"), {
    ...shared,
    followPointer: true,
    onChange(snap) { paintReadout(snap); markState(snap.state); },
  });
  const bot64 = new GrokCharacter(document.getElementById("bot64"), { ...shared, sizePx: 64 });
  const bots = [bot, bot64];
  window.__bots = bots;
  // skip the first idle beat so the face is obvious on load
  bots.forEach((el) => {
    el.moodN = 1;
    el.setState("curious", { resetEyes: true });
  });
  setInterval(() => paintReadout(bot.snapshot()), 80);

  const shapeRoot = document.getElementById("shapes");
  const shapeOrder = ["clay", ...Object.keys(GROK_GEO.shapes).filter((k) => k !== "clay")];
  shapeOrder.forEach((id) => {
    const shape = GROK_GEO.shapes[id];
    if (!shape) return;
    const label = (GROK_TABLES.SHAPE_LABELS && GROK_TABLES.SHAPE_LABELS[id]) || shape.label || id;
    const b = document.createElement("button");
    b.className = "shape";
    b.dataset.shape = id;
    b.title = id;
    b.innerHTML = `<svg viewBox="-15 -15 259 259"><path d="${shape.path}" style="fill:var(--fg)"></path></svg><span>${label}</span>`;
    b.addEventListener("click", () => {
      bots.forEach((el) => el.setShape(id));
      shapeRoot.querySelectorAll("button").forEach((el) => {
        el.setAttribute("aria-pressed", el === b ? "true" : "false");
      });
    });
    if (id === "clay") b.setAttribute("aria-pressed", "true");
    shapeRoot.appendChild(b);
  });

  const swatchRoot = document.getElementById("swatches");
  const colorOrder = ["clay", "dough", "ink", "glaze", "indigoClay", ...Object.keys(GROK_GEO.palette).filter((k) => !["clay", "xiaochi", "accent", "dough", "ink", "glaze", "indigoClay"].includes(k))];
  colorOrder.forEach((id) => {
    const pal = GROK_GEO.palette[id];
    if (!pal) return;
    const b = document.createElement("button");
    b.className = "swatch";
    b.title = (GROK_TABLES.COLOR_LABELS && GROK_TABLES.COLOR_LABELS[id]) || id;
    b.setAttribute("aria-label", b.title);
    b.style.background = pal.light;
    b.addEventListener("click", () => {
      bots.forEach((el) => el.setColor(id, "light"));
      swatchRoot.querySelectorAll("button").forEach((el) => {
        el.setAttribute("aria-pressed", el === b ? "true" : "false");
      });
    });
    if (id === "clay") b.setAttribute("aria-pressed", "true");
    swatchRoot.appendChild(b);
  });

  document.getElementById("mode-onboard").onclick = () => {
    bots.forEach((el) => el.setMode("onboarding"));
    syncModes("onboarding");
  };
  document.getElementById("mode-hold").onclick = () => {
    bots.forEach((el) => el.setMode("hold"));
    syncModes("hold");
  };
  document.getElementById("opt-follow").onclick = () => {
    const on = document.getElementById("opt-follow").getAttribute("aria-pressed") !== "true";
    document.getElementById("opt-follow").setAttribute("aria-pressed", on ? "true" : "false");
    bots.forEach((el) => el.setFollowPointer(on));
  };
  document.getElementById("opt-emphasis").onclick = () => {
    const on = document.getElementById("opt-emphasis").getAttribute("aria-pressed") !== "true";
    document.getElementById("opt-emphasis").setAttribute("aria-pressed", on ? "true" : "false");
    bots.forEach((el) => el.setEmphasis(on));
  };
  document.getElementById("act-spin").onclick = () => bots.forEach((el) => el.spinOnce(1));
  document.getElementById("act-bounce").onclick = () => bots.forEach((el) => el.bounceOnce());
  document.getElementById("act-burst").onclick = () => bots.forEach((el) => el.burstOnce());
</script>
</body>
</html>
